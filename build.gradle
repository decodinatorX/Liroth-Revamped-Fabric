plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

def local_bclib = findProject(':BCLib') != null
def local_wunderlib = findProject(':WunderLib') != null

repositories {
	maven { url 'https://maven.kosmx.dev/' }
    maven { url "https://maven.fabricmc.net/" }
    maven { url 'https://maven.blamejared.com' }
    maven { url "https://maven.shedaniel.me/" }
    maven { url 'https://jitpack.io' }
	maven { url 'https://maven.terraformersmc.com/releases' }
	maven { url 'https://maven.kyrptonaught.dev' }
    maven { url "https://hephaestus.dev/release" }
    maven { url 'https://jitpack.io' }
	maven { url 'https://dvs1.progwml6.com/files/maven/' }
	maven { url 'https://maven.blamejared.com/mezz/jei/' }
	maven { url 'https://maven.blamejared.com/' }
	maven { url 'https://modmaven.dev' }
	maven { url 'https://api.modrinth.com/maven' }
    maven { url 'https://maven.terraformersmc.com' }
	maven { url "https://maven.bai.lol" }
	maven {
		url = "https://maven.ambertation.de/releases"
	}
	maven {
		name = 'GeckoLib'
		url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroup("software.bernie.geckolib")
		}
	}
	maven {
		url "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'GeckoLib'
				url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
			}
		}
		filter { includeGroupAndSubgroups('com.geckolib') }
	}
}

dependencies {
	minecraft ("com.mojang:minecraft:${project.minecraft_version}")

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation "maven.modrinth:8BmcQJ2H:kSxHvs99"

	compileOnly "mezz.jei:jei-26.3-common-api:31.23.0.129"
	compileOnly "mezz.jei:jei-26.3-fabric-api:31.23.0.129"
	runtimeOnly "mezz.jei:jei-26.3-fabric:31.23.0.129"

	implementation "maven.modrinth:7bdKEtKC:JQZrBwiN" // BCLib: New Dawn 26.3.4-fabric
	implementation "maven.modrinth:R8uGDQpB:H14sPcym" // WorldWeaver: New Dawn 26.3.6-fabric
	implementation "maven.modrinth:HZmhgdJk:2PGLqTEO" // WunderLib: New Dawn 26.3.1-fabric

	implementation "maven.modrinth:YBz7DOs8:tSrAp0gK"
}

configurations {
	worldweaverMod
	fabricApiMod
}
configurations.fabricApiMod.transitive = false

dependencies {
	worldweaverMod "maven.modrinth:R8uGDQpB:H14sPcym"
	fabricApiMod "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

def extractedWorldweaverLibraries = layout.buildDirectory.dir("generated/worldweaver-libraries")

// Extract during Gradle configuration so IDE sync sees the API jars immediately.
def worldweaverJar = configurations.worldweaverMod.singleFile
project.sync {
	from(zipTree(worldweaverJar)) {
		include "META-INF/jars/*.jar"
		eachFile { path = name }
		includeEmptyDirs = false
	}
	into extractedWorldweaverLibraries
}
sourceSets.main.compileClasspath += files(fileTree(extractedWorldweaverLibraries) {
	include "*.jar"
})

def extractedFabricApiLibraries = layout.buildDirectory.dir("generated/fabric-api-libraries")
def fabricApiJar = configurations.fabricApiMod.singleFile
project.sync {
	from(zipTree(fabricApiJar)) {
		include "META-INF/jars/*.jar"
		eachFile { path = name }
		includeEmptyDirs = false
	}
	into extractedFabricApiLibraries
}
sourceSets.main.compileClasspath += files(fileTree(extractedFabricApiLibraries) {
	include "*.jar"
})


processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
	}

loom {
    accessWidenerPath = file("src/main/resources/liroth.accesswidener")
	}
}
